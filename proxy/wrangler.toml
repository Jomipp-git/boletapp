name = "boletapp-meteocat"
main = "worker.js"
compatibility_date = "2026-09-18"

# Orígenes que pueden llamar a este proxy. Cualquier otro recibe la respuesta sin cabecera CORS
# y el navegador la bloquea: evita que otras webs usen tu proxy (y tu cuota).
[vars]
ALLOWED_ORIGINS = "https://jomipp-git.github.io,http://localhost:8000"

# La clave NO va aquí. Se guarda como secreto, fuera del repositorio:
#   npx wrangler secret put METEOCAT_KEY
